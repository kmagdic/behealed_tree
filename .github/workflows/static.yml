# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cijela povijest — broj verzije je broj commitova
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # tree-data.<jezik>.js se mijenja često; bez ovoga preglednici serviraju staru
      # kopiju i korisnici vide zastarjele molitve. SHA je jedinstven po deployu.
      # Hvata sve jezične datoteke, pa novi jezik ne traži izmjenu ovdje.
      - name: Cache-busting za tree-data.*.js
        run: sed -i "s/\(tree-data\.[a-z]*\.js\)?v=dev/\1?v=${GITHUB_SHA}/g" index.html
      # Verzija na dnu početnog ekrana: broj commitova · datum zadnjeg commita.
      - name: Verzija
        run: |
          BROJ=$(git rev-list --count HEAD)
          DATUM=$(TZ=Europe/Zagreb git log -1 --date=format-local:%Y-%m-%d --format=%cd)
          sed -i "s/const VERZIJA = { broj: 'dev', datum: '', sha: '' };/const VERZIJA = { broj: '${BROJ}', datum: '${DATUM}', sha: '${GITHUB_SHA}' };/" index.html
          grep -q "broj: '${BROJ}'" index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
